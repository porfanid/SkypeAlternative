title: SkypeAlternative Documentation
description: Secure, end-to-end encrypted chat and video call application
theme: jekyll-theme-cayman
show_downloads: true
repository: porfanid/SkypeAlternative
github:
  repository_url: https://github.com/porfanid/SkypeAlternative
  repository_name: porfanid/SkypeAlternative

# Navigation
nav_links:
  - title: Home
    url: /
  - title: Getting Started
    url: /GETTING_STARTED
  - title: Architecture
    url: /ARCHITECTURE
  - title: Contributing
    url: /CONTRIBUTING
  - title: GitHub
    url: https://github.com/porfanid/SkypeAlternative

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude files from Jekyll build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

# Include files that start with underscore
include:
  - _config.yml

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
